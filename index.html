    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('oxe-maker-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) { /* sem acesso ao storage */ }
      })();
    </script>
  </head>
  <!-- Tema claro (teste): dark era bg-[#050D34] -->
  <body class="bg-[#F1F4FB] text-slate-100 antialiased selection:bg-[#FCC140] selection:text-[#050D34]">

  </body>
